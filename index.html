function render(){
  if (!S.user) { app.innerHTML = loginView() + modalView(); return; }
  const V = {dashboard:dashboardView, bodymap:bodyMapView, trends:trendsView, check:checkView, support:supportView, profile:profileView, help:helpView, devices:devicesView, sim:simView, thresholds:thresholdsView, crew:moCrewView, moProfile:moProfileView};
  app.innerHTML = shell((V[S.page] || dashboardView)()) + modalView() + (S.page === 'dashboard' ? tourCard() : '');
  if (S.page === 'dashboard') tourFocus();
  afterRender(); saveSession();
}
function go(p){
  S.notifOpen = false; S.navOpen = false; if (p !== 'dashboard') S.tour = null;
  if (p === 'check' && S.page !== 'check') S.dc = null;
  S.page = p; render(); window.scrollTo(0, 0);
  const h = document.querySelector('.workspace h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({preventScroll:true}); }
}
const ACCOUNTS = {crew:{'astronaut.a':'A','astronaut.b':'B','astronaut.c':'C'}, mo:{'medical.officer':'MO'}, fs:{'flight.surgeon':'FS'}};

/* Prototype login: any username and any password work. A demo account name logs into that profile (and its role);
   any other name logs into the selected role, crew names using Astronaut A's sample profile. */
function doLogin(u){
  Object.entries(store.accounts()).forEach(([k, v]) => { ACCOUNTS.crew[k] = v.profile || 'A'; });
  const own = Object.keys(ACCOUNTS).find(k => ACCOUNTS[k][u]);
  if (own) S.loginRole = own;
  S.prefill = u; S.loginErr = ''; S.forgot = false; S.guest = false; loadSession('account');
  if (S.loginRole !== 'crew') { S.role = S.loginRole; S.user = S.loginRole === 'fs' ? 'FS' : 'MO'; S.page = 'crew'; }
  else { S.role = 'crew'; S.user = (u && ACCOUNTS.crew[u]) || 'A'; S.page = 'dashboard'; S.area = 'chest'; S.view = 'front'; S.tour = S.toured[S.user] ? null : 0; S.toured[S.user] = true; }
  render(); window.scrollTo(0, 0);
}
document.addEventListener('submit', e => {
  if (e.target.id === 'signupForm') {
    e.preventDefault();
    const name = document.getElementById('suName').value.trim(), u = document.getElementById('suUser').value.trim().toLowerCase();
    const taken = Object.values(ACCOUNTS).some(g => g[u]) || store.accounts()[u];
    if (!name || !u) { S.modal = {...S.modal, err:'Enter your name and a username.', name, u}; render(); return; }
    if (!/^[a-z0-9._-]{3,30}$/.test(u)) { S.modal = {...S.modal, err:'Use 3–30 letters, numbers, dots or dashes for the username.', name, u}; render(); return; }
    if (taken) { S.modal = {...S.modal, err:'That username is already in use.', name, u}; render(); return; }
    const o = {}; PERSIST_KEYS.forEach(k => o[k] = S[k]);
    store.addAccount(u, name); ACCOUNTS.crew[u] = 'A'; store.set('account', o); store.clear('guest');
    S.guest = false; S.session = 'account'; S.accountName = name; S.modal = {type:'signupDone', u}; render(); return;
  }
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  doLogin(document.getElementById('lu').value.trim().toLowerCase());
  return;
  render(); document.getElementById('lp')?.focus();
});

document.addEventListener('toggle', e => {
  const k = e.target && e.target.dataset && e.target.dataset.fold; if (!k) return;
  if (e.target.open) S.dashOpen.add(k); else S.dashOpen.delete(k);
}, true);

document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.change; if (!k) return;
  if (k === 'marsDelay') S.marsDelay = +e.target.value;
  if (k === 'timeLapse') S.timeLapse = e.target.checked ? 60 : 1;
  render();
});

document.addEventListener('input', e => {
  if (e.target.id === 'dcOther' && S.dc) { S.dc.other = e.target.value; const b = document.querySelector('[data-cont]'); if (b) b.disabled = !dcNext(S.dc); }
  if (e.target.id === 'chkText') S.checker.text = e.target.value;
  if (e.target.id === 'riskQ' && S.modal) { S.modal.q = e.target.value; document.getElementById('riskList').innerHTML = riskList(); }
  if (e.target.id === 'dcNote' && S.dc) S.dc.note = e.target.value;
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.modal || S.notifOpen)) { if (S.modal?.stage !== 'sending') S.modal = null; S.notifOpen = false; render(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g.region, tr.click')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true})); }
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.notifOpen) { S.notifOpen = false; render(); } return; }
  const act = el.dataset.act, v = el.dataset.v, id = S.user;
  if (act !== 'notif' && act !== 'notifgo' && S.notifOpen && !e.target.closest('.notif')) S.notifOpen = false;
  switch (act) {
    case 'loginRole': S.loginRole = v; S.prefill = ''; S.loginErr = ''; render(); break;
    case 'prefill': doLogin(v); break;
    case 'forgot': S.forgot = !S.forgot; render(); break;
    case 'guest': Object.assign(S, {role:'crew', user:'A', guest:true, guestHide:false, page:'dashboard', area:'chest', view:'front', loginErr:'', forgot:false}); loadSession('guest'); S.tour = S.toured.A ? null : 0; S.toured.A = true; render(); window.scrollTo(0, 0); break;
    case 'guestHide': S.guestHide = true; render(); break;
    case 'logout': Object.assign(S, {navOpen:false, tour:null, user:null, role:null, guest:false, session:null, accountName:null, prefill:'', modal:null, notifOpen:false, dc:null, moSel:null, checker:{text:'', sev:null, res:null}}); render(); window.scrollTo(0, 0); break;
    case 'go': go(v); break;
    case 'env': S.env[id] = v; render(); break;
    case 'notif': S.notifOpen = !S.notifOpen; render(); break;
    case 'notifgo': S.notifOpen = false; if (v === 'thresholds') { go('thresholds'); break; } if (v.startsWith('mo:')) { S.moSel = v.slice(3); go('moProfile'); } else go(v); break;
    case 'area': S.area = v; if (v === 'eyes' && S.view === 'back') S.view = 'front'; render(); { const g = document.querySelector(`g.region[data-v="${v}"]`); if (e.detail === 0 && g) g.focus(); } break;
    case 'view': S.view = v; if (v === 'back' && S.area === 'eyes') S.area = 'head'; render(); break;
    case 'bmans': {
      S.bmAns[id + ':' + S.area] = v;
      if (v === 'yes') addConcern(id, S.area, CARE(AREA_SELFCARE[S.area]).level === 'urgent' ? 'red' : 'amber', `Answered yes on the body map: “${AREAS[S.area].q}”`, AREA_SELFCARE[S.area]);
      render(); break;
    }
    case 'range': S.range = +v; render(); break;
    case 'dcStep': S.dc.step = +v; render(); window.scrollTo(0, 0); break;
    case 'dcMood': S.dc.mood = v; render(); break;
    case 'dcSleep': S.dc.sleep = v; render(); break;
    case 'dcRead': S.dc.readings = v; render(); break;
    case 'dcSev': S.dc.otherSev = v; render(); break;
    case 'dest': S.dest = v; render(); break;
    case 'devSel': S.devSel = v; render(); break;
    case 'v3d': if (v === 'in') CP3D.zoomIn(); else if (v === 'out') CP3D.zoomOut(); else if (v === 'spin') CP3D.toggleSpin(); else CP3D.reset(); break;
    case 'swxCheck': swxCheck(); break;
    case 'resetDo': S.modal = null; resetDemo(); break;
    case 'medTaken': S.medTaken[id][v] = new Date(); enqueue(id, 'Prescribed medicine taken'); render(); break;
    case 'recStatus': { const r = MEDREC[S.moSel]; r.status = v; if (v === 'confirmed') { r.by = staffWho().name; r.on = `Mission Day ${CREW[S.moSel].day}`; } render(); break; }
    case 'recAllergy': { const r = MEDREC[S.moSel], i = r.allergies.findIndex(a => a.kit === v); if (i >= 0) r.allergies.splice(i, 1); else r.allergies.push({kit:v, what:`Allergy to ${KIT[v].name} (fictional)`}); render(); break; }
    case 'recMed': { const r = MEDREC[S.moSel], i = r.meds.findIndex(m => m.key === v); if (i >= 0) r.meds.splice(i, 1); else r.meds.push({key:v, purpose:'Prescribed by the medical team (fictional)', schedule:'Once every morning'}); render(); break; }
    case 'nav': S.navOpen = !S.navOpen; render(); break;
    case 'linkDown': S.link.up = false; render(); break;
    case 'linkUp': S.link.up = true; S.queue.forEach(q => { if (q.sent == null) q.sent = Date.now(); }); if (S.thPending && S.thPending.sent == null) S.thPending.sent = Date.now(); render(); break;
    case 'scriptStorm': S.script = {type:'storm', step:0, shelter:[]}; ['A','B','C'].forEach(c => S.scenario[c] = 'storm'); ['A','B','C'].forEach(c => enqueue(c, 'Solar particle event forecast acknowledged')); render(); window.scrollTo(0, 0); break;
    case 'scriptNext': stormStep(S.script.step + 1); render(); break;
    case 'inShelter': S.script.shelter.push(S.user); enqueue(S.user, 'In storm shelter'); stormStep(2); render(); break;
    case 'scriptEnd': if (S.script) { stormStep(4); } S.script = null; render(); break;
    case 'thSave': {
      const N = {}; let bad = '';
      T_ROWS.forEach(([g, k, l]) => { const n = parseFloat(document.getElementById(`th-${g}-${k}`).value); if (isNaN(n) || n <= 0) bad = bad || `“${l}” must be a positive number.`; (N[g] = N[g] || {})[k] = n; });
      const ord = [['co2','advisory','caution','CO₂ advisory must be below caution'],['co2','caution','warning','CO₂ caution must be below warning'],['hr','low','high','Heart-rate lower limit must be below the upper limit'],['temp','low','fever','Low body temperature must be below fever'],['temp','fever','high','Fever must be below high fever'],['glu','low','high','Low glucose must be below high glucose'],['o2','low','high','Oxygen lower limit must be below the upper limit'],['pm','elevated','high','Dust “elevated” must be below “very high”'],['noise','caution','alert','Noise caution must be below alert'],['bp','diaHigh','sysHigh','Diastolic upper limit must be below systolic upper limit']];
      if (!bad) ord.forEach(([g, a, b2, msg]) => { if (!bad && !(N[g][a] < N[g][b2])) bad = msg + '.'; });
      const rng = [['co2','warning',0.5,20],['hr','pct',1,100],['hr','high',60,250],['hr','low',20,80],['temp','high',37,43],['temp','low',30,37],['o2','low',10,30],['o2','high',10,40],['press','dropPct',1,50],['rad','factor',1,100]];
      if (!bad) rng.forEach(([g, k, lo, hi]) => { if (!bad && (N[g][k] < lo || N[g][k] > hi)) bad = `“${T_ROWS.find(r => r[0] === g && r[1] === k)[2]}” must be between ${lo} and ${hi}.`; });
      if (bad) { S.thErr = bad; render(); break; }
      S.thErr = ''; S.thPending = {vals:N, created:Date.now(), sent: S.link.up ? Date.now() : null}; render(); break; }
    case 'thReset': S.thPending = {vals: JSON.parse(JSON.stringify(T_DEFAULT)), created:Date.now(), sent: S.link.up ? Date.now() : null}; render(); break;
    case 'thConfirm': if (S.thPending && thArrived()) { T_ROWS.forEach(([g, k]) => T[g][k] = S.thPending.vals[g][k]); S.thPending = null; S.thChanged = new Date(); } render(); break;
    case 'tourStep': S.tour = +v; render(); break;
    case 'tourEnd': S.tour = null; render(); break;
    case 'tourStart': S.tour = 0; S.page = 'dashboard'; render(); window.scrollTo(0, 0); tourFocus(); break;
    case 'goChecker': go('support'); setTimeout(() => { const c = document.getElementById('checker'); if (c) { c.scrollIntoView({block:'start'}); document.getElementById('chkText')?.focus({preventScroll:true}); } }, 30); break;
    case 'info': S.modal = {type:'info', key:v}; render(); break;
    case 'hazard': S.modal = {type:'hazard', key:v}; render(); break;
    case 'measure': S.modal = {type:'measure', key:v}; render(); setTimeout(() => document.querySelector('.modal input')?.focus(), 0); break;
    case 'measureSave': {
      const k = S.modal.key, num = x => parseFloat(document.getElementById(x)?.value);
      let text;
      if (k === 'bp') { const a = num('mSys'), d = num('mDia'); if (isNaN(a) || isNaN(d)) { document.getElementById('mErr').textContent = 'Enter both numbers.'; break; } S.sim[id].sys = a; S.sim[id].dia = d; text = `${a}/${d} mmHg`; }
      else { const a = num('mVal'); if (isNaN(a)) { document.getElementById('mErr').textContent = 'Enter your reading.'; break; } S.sim[id][k] = a; text = `${a} ${INFO[k].unit}`; }
      S.simTime[id] = new Date(); S.measured[id][k] = {time:new Date(), text}; enqueue(id, `${INFO[k].title} reading`);
      S.modal = {type:'measure', key:k, stage:'done', text}; render(); break; }
    case 'fluid': S.nutri[id].fluids += +v; render(); break;
    case 'meal': S.nutri[id].meals[v] = !S.nutri[id].meals[v]; render(); break;
    case 'vitd': S.nutri[id].vitd = !S.nutri[id].vitd; render(); break;
    case 'exercise': S.exercise[id] = true; render(); break;
    case 'simApply': {
      const o = {};
      SIM_VITALS.concat(SIM_ENV).forEach(([k]) => { const el = document.getElementById('sim-' + k); const n = parseFloat(el.value); const d = simDefault(id, k);
        if (!isNaN(n) && (d == null || Math.abs(n - d) > 1e-9)) o[k] = n; });
      const tox = +document.getElementById('sim-tox').value; if (tox) o.tox = tox;
      if (document.getElementById('sim-waterq').value === 'fail') o.waterq = 'fail';
      S.sim[id] = o; S.simTime[id] = new Date(); enqueue(id, 'Sensor readings update');
      if (['hr','co2','dehy'].includes(S.scenario[id])) S.scenario[id] = 'none';
      S.scenario[id] = document.getElementById('sim-storm').checked ? 'storm' : (S.scenario[id] === 'storm' ? 'none' : S.scenario[id]);
      S.simMsg = `Readings sent at ${fmtT(S.simTime[id])}. ${Object.keys(o).length} value${Object.keys(o).length === 1 ? '' : 's'} differ from normal.`;
      render(); break; }
    case 'simReset': S.sim[id] = {}; if (S.scenario[id] === 'storm') S.scenario[id] = 'none'; S.simMsg = 'Readings reset to normal.'; render(); break;
    case 'simPreset': {
      const pr = SIM_PRESETS.find(x => x[0] === v); S.sim[id] = pr[2](id); S.simTime[id] = new Date(); enqueue(id, `Sensor readings: ${pr[1]}`);
      if (S.scenario[id] !== 'none') S.scenario[id] = 'none';
      S.simMsg = `Preset “${pr[1]}” sent at ${fmtT(S.simTime[id])}.`; render(); break; }
    case 'risks': S.modal = {type:'risks', env: staff() ? S.env[S.moSel] : S.env[id], q:'', cov:'all'}; render(); break;
    case 'riskCov': S.modal.cov = v; render(); { const q = document.getElementById('riskQ'); if (q) q.value = S.modal.q; } break;
    case 'screenDone': S.screenDone[id + ':' + v] = true; render(); break;
    case 'chkSev': S.checker.sev = v; render(); break;
    case 'chkRun': if (!S.checker.text.trim()) { S.checker.err = 'Describe your symptom first.'; render(); break; } S.checker.err = ''; S.checker.res = analyze(S.checker.text, S.checker.sev); S.checker.reported = false; render(); break;
    case 'chkReport': { const r = S.checker.res, lv = r.level === 'urgent' ? 'red' : 'amber';
      if (r.unknown) addConcern(id, 'whole', lv, `Described: “${S.checker.text}” (not recognised — for medical officer review)`, 'Other');
      else r.hits.forEach(e => addConcern(id, e.area, lv, `Described: “${S.checker.text}” — ${e.title}`, e.key));
      S.checker.reported = true; render(); break; }
    case 'chkClear': S.checker = {text:'', sev:null, res:null}; render(); break;
    case 'dcSym': {
      const s = S.dc.symptoms;
      if (v === 'No symptoms') S.dc.symptoms = s.includes(v) ? [] : [v];
      else { const f = s.filter(x => x !== 'No symptoms'); S.dc.symptoms = f.includes(v) ? f.filter(x => x !== v) : f.concat(v); }
      render(); break;
    }
    case 'dcSubmit': {
      const d = S.dc;
      const otherRes = d.symptoms.includes('Other') ? analyze(d.other, d.otherSev) : null;
      S.today[id] = {time:new Date(), mood:d.mood, sleep:d.sleep, symptoms:d.symptoms.slice(), other:d.other, otherSev:d.otherSev, otherRes, readings:d.readings, note:d.note};
      const ck = careKeys(S.today[id]), dcLv = ck.includes('urgent') || ck.includes('manyunwell') ? 'red' : 'amber';
      d.symptoms.filter(x => x !== 'No symptoms' && x !== 'Other').forEach(sym => (SYM_AREA[sym] || []).forEach(a => addConcern(id, a, dcLv, `Reported in Daily Check: ${sym}`, sym)));
      if (otherRes) {
        const lv = otherRes.level === 'urgent' ? 'red' : 'amber';
        if (otherRes.unknown) addConcern(id, 'whole', lv, `Reported in Daily Check: “${d.other}” (not recognised — for medical officer review)`, 'Other');
        else otherRes.hits.forEach(e => addConcern(id, e.area, lv, `Reported in Daily Check: “${d.other}” — ${e.title}`, e.key));
      }
      enqueue(id, 'Daily check-in'); d.step = 7; render(); window.scrollTo(0, 0); break;
    }
    case 'dcSummary': S.page = 'check'; S.dc = {step:7}; render(); window.scrollTo(0, 0); break;
    case 'scenario': S.scenario[id] = v; S.hrRepeat[id] = false; render(); break;
    case 'repeat': S.hrRepeat[id] = true; render(); break;
    case 'moOpen': S.moSel = v; go('moProfile'); break;
    case 'modal': S.modal = {type:v}; render(); setTimeout(() => document.querySelector('.modal textarea, .modal .choice, .modal .btn')?.focus(), 0); break;
    case 'overlay': if (e.target === el && S.modal?.stage !== 'sending') { S.modal = null; render(); } break;
    case 'close': S.modal = null; render(); break;
    case 'helpSend': if (v.includes('mission')) enqueue(id, 'Call for Help — Mission Control'); S.modal = {type:'help', stage:'sending', to:v}; render(); setTimeout(() => { if (S.modal?.stage === 'sending') { S.modal.stage = 'done'; render(); } }, 1300); break;
    case 'msgSend': S.modal = {type:'contact', stage:'done'}; render(); break;
    case 'urgSend': {
      const txt = document.getElementById('urgText').value.trim() || 'Urgent concern reported (no description)';
      const area = document.getElementById('urgArea').value;
      addConcern(id, area, 'red', `Urgent report: ${txt}`);
      S.modal = {type:'urgentDone'}; S.page = 'support'; render(); window.scrollTo(0, 0); break;
    }
  }
});

render();
</script>
</body>
</html>
