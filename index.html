<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrewPulse — Astronaut Health Monitoring System</title>
<style>
:root{
  --indigo:#6A759B; --navy:#21273D; --powder:#B9D4F1; --cloud:#F1F6F8;
  --line:#DCE4EC; --line2:#EDF1F5;
  --ok:#1F7A4F; --ok-bg:#E3F3EA;
  --amber:#8A5A00; --amber-dot:#E3A32E; --amber-bg:#FDF2DC;
  --red:#B42318; --red-bg:#FBE6E3;
  --grey:#5B657C; --grey-bg:#EEF1F5;
  --r-card:14px; --r-btn:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--cloud);color:var(--navy);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;color:var(--navy);letter-spacing:-.01em}
h1{font-size:26px;font-weight:700;line-height:1.25}
h2{font-size:18px;font-weight:600;line-height:1.3}
h3{font-size:15.5px;font-weight:600}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:var(--navy)}
.muted{color:var(--indigo)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.sidebar{background:var(--navy);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 24px}
.brand b{font-size:18px;color:#fff;display:block;line-height:1.2}
.brand small{display:block;font-size:11px;color:#AEB7D0;font-weight:500;line-height:1.3}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:#D3D9E8;font-size:14.5px;font-weight:500;text-align:left}
.nav-btn:hover{background:rgba(185,212,241,.12);color:#fff}
.nav-btn.active{background:var(--powder);color:var(--navy);font-weight:600}
.nav-btn:focus-visible{outline:2px solid var(--powder);outline-offset:2px}
.nav-btn svg{flex:none}
.nav-sep{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8790AE;padding:14px 12px 4px}
.nav-badge{margin-left:auto;background:var(--amber-dot);color:var(--navy);font-size:12px;font-weight:700;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.proto{font-size:12px;color:#AEB7D0;padding:4px 12px 6px;display:flex;gap:8px;align-items:flex-start}
.proto i{width:8px;height:8px;border-radius:50%;background:var(--powder);margin-top:5px;flex:none}
.main{display:flex;flex-direction:column;min-width:0}
.header{height:75px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 30px;position:sticky;top:0;z-index:20}
.h-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.h-title{font-weight:600;font-size:15px}
.workspace{padding:30px;width:100%;max-width:1320px}
.env-sel{display:flex;align-items:center;gap:12px}
.seg{display:inline-flex;background:var(--cloud);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--indigo)}
.seg button:hover{color:var(--navy)}
.seg button.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 2px rgba(33,39,61,.12),inset 0 0 0 1px var(--powder)}
.icon-btn{position:relative;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--indigo)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--amber-dot);color:var(--navy);font-size:11.5px;font-weight:700;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;border:2px solid #fff;padding:0 4px}
.who{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:4px 6px;border-radius:10px}
.who:hover{background:var(--cloud)}
.who b{display:block;font-size:14px;line-height:1.2}
.who small{display:block;font-size:12px;color:var(--indigo)}
.notif-wrap{position:relative}
.notif{position:absolute;right:0;top:50px;width:360px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(33,39,61,.14);padding:8px;z-index:40}
.notif h3{padding:8px 10px 6px}
.notif-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;border:0;background:transparent;width:100%;text-align:left}
.notif-item:hover{background:var(--cloud)}
.notif-item b{font-size:14px;display:block;font-weight:600}
.notif-item span{font-size:13px;color:var(--indigo)}

/* ---------- components ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.card.hl{background:var(--powder);border-color:#A8C5E6}
.card.dashed{border-style:dashed;background:transparent}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:var(--r-btn);border:1px solid transparent;font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none}
.btn:focus-visible{outline:3px solid var(--powder);outline-offset:2px}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:#323a5a}
.btn-secondary{background:var(--indigo);color:#fff}
.btn-secondary:hover{background:#5a6488}
.btn-ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--indigo)}
.btn-help{background:var(--red);color:#fff}
.btn-help:hover{background:#991d14}
.btn-lg{height:50px;padding:0 24px;font-size:15.5px}
.btn-sm{height:34px;padding:0 13px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--indigo);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--navy)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--grey-bg);color:var(--grey);white-space:nowrap}
.tag.sim{background:#EBF0F8;color:var(--indigo)}
.tag.real{background:#E5F4E4;color:#1E6B3A;border:1px solid #B9DFC3;display:inline-flex;align-items:center;gap:3px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap}
.st-ok{background:var(--ok-bg);color:var(--ok)}
.st-amber{background:var(--amber-bg);color:var(--amber)}
.st-red{background:var(--red-bg);color:var(--red)}
.st-grey{background:var(--grey-bg);color:var(--grey)}
.st-info{background:#E5EEF9;color:var(--navy)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:14px}
.note svg{flex:none;margin-top:2px}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.amber{background:var(--amber-bg);color:var(--amber)}
.note.red{background:var(--red-bg);color:var(--red)}
.note.info{background:#E9F1FA;color:var(--navy)}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head p{margin-top:4px}
.footnote{font-size:12.5px;color:var(--indigo);margin-top:26px;display:flex;gap:8px;align-items:center}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--indigo);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#F7FAFC}
.kv{display:grid;grid-template-columns:170px 1fr;gap:12px 16px;margin:0}
.kv dt{font-size:13px;font-weight:600;color:var(--indigo)}
.kv dd{margin:0}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden}
.login-art{position:absolute;inset:0;pointer-events:none}
.login-top{display:flex;align-items:center;gap:12px;margin-bottom:26px;position:relative}
.login-top b{font-size:22px;display:block;line-height:1.2}
.login-top small{color:var(--indigo);font-size:13px}
.login-card{width:100%;max-width:440px;padding:32px;position:relative;box-shadow:0 10px 40px rgba(33,39,61,.08)}
.login-card h1{font-size:24px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;margin-top:14px}
.field input,.field textarea,.field select{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 13px;font-size:15px;font-weight:400;background:#fff}
.field textarea{height:96px;padding:11px 13px;resize:vertical}
.field-input{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 13px;font-size:14.5px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(185,212,241,.7)}
.err{color:var(--red);font-size:13.5px;min-height:20px;margin-top:8px}
.demo-acc{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px 4px 4px;font-size:13.5px;font-weight:500}
.chip:hover{border-color:var(--indigo)}
.chip.on{background:var(--powder);border-color:var(--powder)}
.sys{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:20px;font-size:12.5px;color:var(--indigo)}
.sys i{width:8px;height:8px;border-radius:50%;background:var(--indigo)}

/* ---------- dashboard ---------- */
.welcome{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.welcome .meta{color:var(--indigo);margin-top:2px}
.hero{display:flex;align-items:center;gap:28px;padding:28px 30px;margin-bottom:28px}
.hero h2{font-size:24px;margin:6px 0 6px}
.hero p{color:var(--navy);max-width:560px}
.hero-ic{width:64px;height:64px;border-radius:16px;background:#fff;display:grid;place-items:center;flex:none;color:var(--navy)}
.ind{display:flex;flex-direction:column;gap:10px}
.ind-top{display:flex;align-items:center;gap:9px}
.ind-ic{width:32px;height:32px;border-radius:9px;background:var(--cloud);display:grid;place-items:center;color:var(--indigo)}
.ind-label{font-weight:600;font-size:14.5px}
.ind-val{display:flex;align-items:baseline;gap:6px}
.ind-val b{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.ind-val b.word{font-size:24px}
.ind-val span{color:var(--indigo);font-size:14px}
.ind-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.env-panel{display:flex;gap:24px;align-items:center}
.env-items{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1}
.env-item{background:rgba(255,255,255,.7);border-radius:10px;padding:12px 14px}
.env-item span{display:block;font-size:12.5px;color:var(--navy);opacity:.8}
.env-item b{font-size:18px}
.todo{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}
.todo:last-child{border-bottom:0}
.todo-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.fab{position:fixed;right:28px;bottom:26px;z-index:30;height:52px;padding:0 22px;border-radius:999px;box-shadow:0 8px 24px rgba(180,35,24,.3);font-size:15px}

/* ---------- body map ---------- */
.bm-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.bm-stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px}
.bodysvg{width:100%;max-width:320px;height:auto;display:block;overflow:visible}
.region .shape{stroke-linejoin:round}
.region .hair{fill:#21273D!important;stroke:none!important;opacity:.16;pointer-events:none}
.region .iris{fill:#21273D!important;stroke:none!important;pointer-events:none}
.region{transition:filter .15s}
.region:hover{filter:drop-shadow(0 2px 6px rgba(33,39,61,.22))}
.region{cursor:pointer;outline:none}
.region>*{fill:#DCE9F8;stroke:#9CB6D5;stroke-width:1.5;transition:fill .15s,stroke .15s}
.region:hover>*,.region:focus-visible>*{fill:#B9D4F1;stroke:#6A759B}
.region:focus-visible>*{stroke-width:3}
.region.sel>*{fill:#6A759B;stroke:#21273D}
.region.unavail>*{fill:#E4E7EC;stroke:#C2C8D2}
.region.unavail.sel>*{fill:#9AA3B5;stroke:#5B657C}
.region .hit{fill:transparent!important;stroke:none!important}
.region .eye{fill:#fff;stroke:#6A759B}
.region:hover .eye{fill:#B9D4F1}
.region.sel .eye{fill:#6A759B;stroke:#21273D;stroke-width:2.5}
.region.unavail .eye{fill:#C9CED8;stroke:#9AA3B5}
.region.unavail.sel .eye{fill:#9AA3B5;stroke:#5B657C}
.region.st-ok>*{fill:#DDF1E4;stroke:#5FAF80}
.region.st-amber>*{fill:#FBE5B6;stroke:#D4900F}
.region.st-red>*{fill:#F7CFC9;stroke:#B42318}
.region.st-ok:hover>*,.region.st-ok:focus-visible>*{fill:#C4E7D1}
.region.st-amber:hover>*,.region.st-amber:focus-visible>*{fill:#F8D88F}
.region.st-red:hover>*,.region.st-red:focus-visible>*{fill:#F2B5AD}
.region.sel>*{stroke:#21273D;stroke-width:3.5}
.region.sel.st-ok>*{fill:#9FD6B4}
.region.sel.st-amber>*{fill:#F3C66B}
.region.sel.st-red>*{fill:#EC9C92}
.region.st-ok .eye,.region.st-amber .eye,.region.st-red .eye{fill:#fff;stroke:#21273D}
.ht-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.ht-stat{background:var(--cloud);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.ht-stat b{font-size:22px;color:var(--navy);display:flex;align-items:center;gap:8px}
.ht-stat span{font-size:12.5px;color:var(--grey)}
.ht-dot{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.login-hint{display:flex;gap:10px;align-items:flex-start;background:#EEF4FB;border:1px solid #D3E2F3;border-radius:12px;padding:10px 12px;margin:14px 0 4px;font-size:13.5px;color:var(--navy);line-height:1.45}
.login-hint svg{flex:none;margin-top:1px;color:var(--indigo)}
.guest-cta{width:100%;margin-top:22px;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;border:0;background:var(--navy);color:#fff;text-align:left;cursor:pointer;font:inherit;box-shadow:0 10px 24px -12px rgba(33,39,61,.6);transition:transform .15s,box-shadow .15s}
.guest-cta:hover{transform:translateY(-1px);box-shadow:0 14px 28px -12px rgba(33,39,61,.7)}
.guest-cta:focus-visible{outline:3px solid var(--powder);outline-offset:2px}
.guest-ic{width:44px;height:44px;border-radius:12px;background:rgba(185,212,241,.18);display:grid;place-items:center;flex:none;color:var(--powder)}
.guest-tx{display:flex;flex-direction:column;gap:2px;flex:1}.guest-tx b{font-size:17px}.guest-tx span{font-size:13px;color:#C9D6E8}
.guest-arrow{color:var(--powder)}
.or{display:flex;align-items:center;gap:12px;margin:20px 0 14px;color:var(--grey);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.guest-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:4px solid var(--indigo);border-radius:14px;padding:10px 12px 10px 14px;margin-bottom:18px;font-size:13.5px;color:var(--navy)}
.guest-banner span{flex:1;min-width:200px}
.icon-x{border:0;background:transparent;color:var(--grey);cursor:pointer;width:32px;height:32px;border-radius:8px;display:grid;place-items:center}.icon-x:hover{background:var(--cloud)}
.showcase{background:radial-gradient(120% 90% at 50% 0%,#FFFFFF 0%,#EEF3F9 55%,#E3EAF4 100%);border-radius:24px;padding:18px;box-shadow:0 1px 2px rgba(33,39,61,.05),0 18px 40px -24px rgba(33,39,61,.35)}
.stage-wrap{position:relative;height:clamp(320px,52vh,560px);border-radius:18px;overflow:hidden}
.stage3d{position:absolute;inset:0}
.cp3d-canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
.cp3d-canvas:active{cursor:grabbing}
.cp3d-canvas:focus-visible{box-shadow:inset 0 0 0 3px var(--powder)}
.stage-overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.stage-msg{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--navy);text-align:center;font-size:14px}
.stage-thumb{max-width:min(520px,80%);max-height:70%;border-radius:12px}
.stage-badge{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#fff;padding:6px 12px;border-radius:999px;font-size:12px;box-shadow:0 4px 14px rgba(33,39,61,.12)}
.stage-top{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.stage-title{font-size:26px;margin-top:2px}
.stage-tools{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.92);color:var(--navy);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(33,39,61,.12);transition:transform .15s,background .15s}
.icon-btn:hover{background:#fff;transform:translateY(-1px)}
.stage-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--indigo);background:rgba(255,255,255,.85);padding:6px 12px;border-radius:999px;display:flex;gap:6px;align-items:center;white-space:nowrap;pointer-events:none}
.hint-short{display:none}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--powder);border-top-color:var(--navy);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dev-strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-top:14px}
.dev-tile{background:rgba(255,255,255,.75);border:1.5px solid transparent;border-radius:14px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:inherit;color:var(--navy);position:relative;transition:border-color .15s,background .15s,transform .15s}
.dev-tile:hover{background:#fff;transform:translateY(-2px)}
.dev-tile.on{border-color:var(--navy);background:#fff}
.dev-tile b{font-size:11.5px;font-weight:600;line-height:1.25;text-align:center}
.dev-img{width:100%;aspect-ratio:4/3;display:grid;place-items:center;color:var(--indigo)}
.dev-img img{width:100%;height:100%;object-fit:contain}
.dev-flag{position:absolute;top:6px;right:6px;font-size:10px;font-weight:700;background:var(--amber-bg);color:var(--amber);padding:1px 6px;border-radius:999px}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.spec{display:flex;gap:12px}
.spec b{font-size:13.5px}.spec p{font-size:13px;color:var(--grey);margin-top:2px;line-height:1.45}
.spec-ic{width:34px;height:34px;border-radius:10px;background:var(--cloud);color:var(--navy);display:grid;place-items:center;flex:none}

ved behavioral sleep strategies; assess contributing illness or medication.",["symptom"],"Observed in human spaceflight (group-level source: NASA Behavioral Health Risk, Risk from Sleep Loss, Circadian Desynchronization and Work Overload; see source column)","I, D, H","G06 – Mental health, cognition and sleep support","Protect sleep from shift changes, noise and vibration; maintain private communication and routine."],["Skin, wounds and thermal injury","Thermal stress: overheating, heat illness, hypothermia or cold injury","Suit heat rejection or thermal-control limitations, workload, insulation, ventilation, environmental extremes and equipment failure can cause heat strain, overheating, hypothermia or cold injury.","Reduce workload and terminate/modify EVA or move to a safe thermal environment according to mission rules; use approved cooling or warming measures and hydration procedures. Severe symptoms require immediate medical/mission response.",["vitals","symptom"],"Observed human thermal hazard; platform-specific incidence varies","D, G, H","G15 – Pressure, EVA and thermal physiology","Use pre- and post-landing/EVA readiness gates; account for pressure transitions and high-g phases; make emergency guidance accessible offline."],["Pressure, EVA and thermal physiology","Altitude sickness/hypobaric illness","Reduced ambient pressure/oxygen in habitat or suit failure; on Mars ambient atmosphere is unbreathable and near-vacuum, not a normal high-altitude exposure.","Check cabin/ suit environmental status and exposure; move to safe air supply per protocol; reduce exertion; use onboard respiratory assessment and urgent escalation for severe breathing difficulty.",["sensor","symptom"],"Analog / limited direct spaceflight evidence","D, G, H","G15 – Pressure, EVA and thermal physiology","Use pre- and post-landing/EVA readiness gates; account for pressure transitions and high-g phases; make emergency guidance accessible offline."],["Pressure, EVA and thermal physiology"," oup-level source: NASA Food and Nutrition Risk, Risk of Renal Stone Formation; see source column)","G, H","G09 – Digestive, nutrition, hydration and renal management","Compact food/fluid logging and GI kit; account for launch-related nausea and limited medical space."],["Medication safety","Medication degradation, reduced potency, altered pharmacokinetics and adverse drug effects","Radiation, storage temperature, packaging, shelf life, altered physiology, limited inventory and no resupply.","For a radiation event: follow shelter/retreat protocol, maximize shielding, minimize time in exposed areas, log dose and notify medical/mission operations. Long-term risk: dose surveillance and scheduled clinical follow-up.",[],"Analog / limited direct spaceflight evidence","R, D","G14 – Medication safety and onboard medical logistics","Compact protected storage, strict inventory and offline reminder capability."],["Reproductive health","Pregnancy-related complications and reproductive health emergencies","Radiation and altered gravity effects on pregnancy are poorly understood; routine gynecologic conditions still possible.","For a radiation event: follow shelter/retreat protocol, maximize shielding, minimize time in exposed areas, log dose and notify medical/mission operations. Long-term risk: dose surveillance and scheduled clinical follow-up.",["symptom"],"Anticipated / uncertain","R, D","G13 – Reproductive and gynecological health support","Ensure privacy and adequate supplies in constrained volume; establish confidential care pathway."],["Reproductive health","Reproductive/germ-cell effects and heritable genetic damage","Ionizing radiation can damage germ cells; spaceflight-specific fertility and offspring outcomes are poorly characterized.","For a radiation event: follow shelter/retreat protocol, maximize shielding, minimize time in exposed areas, log dose and notify medical/mission operations. Long-term risk: dose surveillance and scheduled clinical follow-up.",["screeni al sleep strategies; assess contributing illness or medication.",["symptom"],"Observed in human spaceflight (group-level source: NASA Behavioral Health Risk, Risk from Sleep Loss, Circadian Desynchronization and Work Overload; see source column)","I, D, H","G06 – Mental health, cognition and sleep support","Protect sleep from shift changes, noise and vibration; maintain private communication and routine."],["Digestion, nutrition, hydration and metabolism","Blood glucose variability / altered glucose regulation and possible insulin resistance","Mission-related changes in activity, diet, sleep, gravity and environmental exposure may affect glucose regulation; direct long-duration evidence is limited. Non-ionizing exposure depends on vehicle, equipment and surface operations.","Use individualized nutrition, activity and exposure-control plans; seek clinician review for persistent abnormal trends or symptoms.",["screening","vitals"],"Anticipated / limited long-duration evidence","G, H","G09 – Digestive, nutrition, hydration and renal management","Compact food/fluid logging and GI kit; account for launch-related nausea and limited medical space."],["Radiation and blood effects","Non-ionizing radiation exposure and potential skin, eye or performance effects","Mission-related changes in activity, diet, sleep, gravity and environmental exposure may affect glucose regulation; direct long-duration evidence is limited. Non-ionizing exposure depends on vehicle, equipment and surface operations.","Use individualized nutrition, activity and exposure-control plans; seek clinician review for persistent abnormal trends or symptoms.",["sensor","symptom"],"NASA-recognized risk; exposure-specific evidence to verify","R","G03 – Radiation exposure and biological-effects management","Shielded storm-shelter planning and rapid crew notification are central; use redundant radiation alerts."],["Injuries, egress and medical emergencies","Vehicle / habitat egress readiness after landing or gravity transition","Gravity transition, orthostatic intolerance, anemia, sensorimotor changes, fatigue and suit/vehicle constraints may affect safe exit and post-landing tasks.","Use mission-approved countermeasures, hydration and staged egress procedures; do not attempt standing tests if unsafe; follow crew medical officer protocol.",["symptom","support"],"NASA-recognized risk; mission-specific performance evidence to verify","D, G, H","G11 – Trauma, acute medical events and emergency response","Crew restraint and launch/landing injury procedures; self-contained emergency response and limited evacuation assumptions."]],"station":[["Radiation and blood effects","Cancer and hematologic malignancy risk","Cumulative ionizing radiation damages DNA; galactic cosmic rays and solar particle events contribute.","For a radiation event: follow shelter/retreat protocol, maximize shielding, minimize time in exposed areas, log dose and notify medical/mission operations. Long-term risk: dose surveillance and scheduled clinical follow-up.",["screening"],"Observed in human spaceflight (group-level source: NASA Risk of Radiation Carcinogenesis; see source column)","R","G03 – Radiation exposure and biological-effects management","Area monitors across modules and clear shelter access; integrate cumulative dose with mission records."],["Blood and hematologic health","Iron status changes/anemia or altered red-cell mass","Spaceflight-associated red-cell turnover and hemolysis, fluid-volume shifts, iron/nutritional status and other medical causes can contribute to anemia or altered red-cell indices.","Review laboratory findings, nutrition, hydration, mission exposures and symptoms with the flight surgeon. Any supplementation or treatment is clinician-directed; do not automatically prescribe iron or other medication.",["screening"],"Observed in human spaceflight (14-astronaut, six-month ISS hemolysis study); clinical anemia is not inferred from wearable data","G, H","G09 – Digestive, nutrition, hydration and renal management","Integrate nutrition and hydration planning with exercise and routine medical checks."],["Bones, muscles and physical conditioning","Back pain, spinal elongation and intervertebral disc injury","Spinal unloading/elongation and altered posture; reloading during landing/return may stress discs.","Use prescribed resistance/aerobic exercise and load-management plan; adapt tasks and restraints; protect injured area and follow fracture/injury assessment protocol when trauma or severe pain occurs.",["symptom"],"Anticipated / uncertain","G","G04 – Bone, muscle and physical-conditioning support","Integrate scheduled exercise countermeasures and periodic functional assessments."],["Bones, muscles and physical conditioning","Bone mineral density loss, altered bone microarchitecture and increased resorption","Mechanical unloading increases bone resorption and urinary calcium; recovery may be incomplete or slow.","Use prescribed resistance/aerobic exercise and load-management plan; adapt tasks and restraints; protect injured area and follow fracture/injury assessment protocol when trauma or severe pain occurs.",["screening"],"Observed in human spaceflight (group-level source: NASA Risk of Bone Fracture due to Spaceflight-induced Changes to Bone, Muscle Risk; see source column)","G","G04 – Bone, muscle and physical-conditioning support","Integrate scheduled exercise countermeasures and periodic functional assessments."],["Dental, ear, nose and throat","Dental pain, caries, fracture, abscess and oral infection","Caries, cracked or fractured teeth, pulpal inflammation, abscess, oral infection, trauma, diet and limited access to definitive dental care during a mission.","Maintain oral hygiene and prevention plan; protect a damaged tooth and avoid aggravating chewing; follow the onboard dental-emergency protocol. Facial swelling, fever, spreading infection, uncontrolled pain or trouble swallowing/breathing requires prompt medical escalation.",["screening","symptom"],"Observed clinical condition; mission-specific incidence/capability varies","H, D","G12 – Dental, ear, nose, throat and hearing care","Routine oral care, noise monitoring and accessible examination tools."],["Bones, muscles and physical conditioning","Joint, tendon and muscle sprains/strains; overuse injuries","Exercise, restraint use, awkward body positioning, repetitive maintenance and suit operations.","Use prescribed resistance/aerobic exercise and load-management plan; adapt tasks and restraints; protect injured area and follow fracture/injury assessment protocol when trauma or severe pain occurs.",["symptom"],"Analog / limited direct spaceflight evidence","G","G04 – Bone, muscle and physical-conditioning support","Integrate scheduled exercise countermeasures and periodic functional assessments."],["Bones, muscles and physical conditioning","Muscle atrophy, weakness and reduced endurance","Unloading of postural and locomotor muscles in microgravity; partial gravity unloading is less severe but still substantial.","Use prescribed resistance/aerobic exercise and load-management plan; adapt tasks and restraints; protect injured area and follow fracture/injury assessment protocol when trauma or severe pain occurs.",["screening"],"Observed in human spaceflight (group-level source: NASA Risk of Bone Fracture due to Spaceflight-induced Changes to Bone, Muscle Risk; see source column)","G","G04 – Bone, muscle and physical-conditioning support","Integrate scheduled exercise countermeasures and periodic functional assessments."],["Radiation and blood effects","Acute radiation syndrome or prodromal effects after major solar particle event","Large solar particle event can cause nausea, vomiting, fatigue, blood-cell changes at sufficient dose.","For a radiation event: follow shelter/retreat protocol, maximize shielding, minimize time in exposed areas, log dose and notify medical/mission operations. Long-term risk: dose surveillance and scheduled clinical f on.","Check cabin/ suit environmental status and exposure; move to safe air supply per protocol; reduce exertion; use onboard respiratory assessment and urgent escalation for severe breathing difficulty.",["symptom"],"Observed in human spaceflight (group-level source: NASA Risk of Decompression Sickness, EVA Risk; see source column)","D, G, H","G15 – Pressure, EVA and thermal physiology","Use rugged, low-interaction checklists; track rover pressure/thermal conditions and excursion duration; return-to-rover/base decision support."],["Injuries, egress and medical emergencies","Delayed diagnosis, limited treatment, medical error and inability to evacuate","Communication latency, limited crew medical expertise, finite equipment/drugs, diagnostic uncertainty and no rapid evacuation.","Oral hygiene, rinse/cleaning and protective care; use dental/ENT procedure checklist; escalate facial swelling, fever, trauma, severe pain or airway/swallowing problems.",["support"],"Observed in human spaceflight (group-level source: NASA Dynamic Loads Risk, Risk of Adverse Health Outcomes due to Inflight Medical Conditions; see source column)","D, H","G11 – Trauma, acute medical events and emergency response","High-priority SOS, crew location, rover status and return-to-habitat/backup rescue plan; compact trauma kit."],["Dental, ear, nose and throat","Noise exposure, hearing loss, tinnitus and sleep disruption","Fans, pumps, machinery, vehicles, tools and vibration transmitted through structures.","Protect a consistent sleep opportunity; adjust light, noise, workload and shift timing; use approved behavioral sleep strategies; assess contributing illness or medication.",["sensor","screening","symptom"],"Observed in human spaceflight (group-level source: NASA Risk of Hearing Loss due to Acoustics Issues in Space, Risk of Adverse Health Outcomes due to Inflight Medical Conditions; see source column)","I, D, H","G12 – Dental, ear, nose, throat and hearing care","Hearing protection and pressur /medical assessment for new visual change, severe headache or neurologic symptoms; reduce risky tasks until assessed; follow prescribed monitoring.",["screening","symptom"],"Observed in human spaceflight (group-level source: NASA SANS Risk; see source column)","R, G, H","G07 – Eye, vision and ocular-surface care","Sealed eye protection, dust-safe procedures and immediate access to eye-irrigation kit."],["Heart and circulation","Cardiac deconditioning; reduced cardiac filling or altered cardiac structure/function","Reduced hydrostatic loading and exercise challenges alter cardiac workload and conditioning.","Use prescribed resistance/aerobic exercise and load-management plan; adapt tasks and restraints; protect injured area and follow fracture/injury assessment protocol when trauma or severe pain occurs.",["screening"],"Observed in human spaceflight (group-level source: NASA Risk of Cardiovascular Adaptations (CV Risk), Concern of Venous Thromboembolism; see source column)","R, G","G01 – Cardiovascular and circulation management","Rugged wearable; minimize measurement burden during EVA; assess before/after excursions; urgent return-to-habitat plan for red flags."],["Heart and circulation","Cardiac rhythm disturbances/arrhythmias","Autonomic changes, electrolyte shifts, workload, illness and radiation are potential contributors.","For a radiation event: follow shelter/retreat protocol, maximize shielding, minimize time in exposed areas, log dose and notify medical/mission operations. Long-term risk: dose surveillance and scheduled clinical follow-up.",["vitals","symptom"],"Analog / limited direct spaceflight evidence","R, G","G01 – Cardiovascular and circulation management","Rugged wearable; minimize measurement burden during EVA; assess before/after excursions; urgent return-to-habitat plan for red flags."],["Skin, wounds and thermal injury","Electrical injury/electrocution and secondary burns","Damaged wiring, power systems, wet maintenance, battery faults and limited isolation.","Offer private self-help tools, structured peer support, workload/rest adjustments and confidential clinician consultation; urgent safety concerns trigger immediate crew medical/mission protocol.",["symptom"],"Analog / limited direct spaceflight evidence","H","G10 – Skin, wounds, burns and surface-contact protection","Dust exclusion and suit inspection before/after EVA; rugged dressings and glove-compatible controls."],["Heart and circulation","Orthostatic intolerance, presyncope or syncope after return to gravity","Plasma-volume reduction, altered autonomic regulation and cardiovascular deconditioning impair standing tolerance.","Use prescribed resistance/aerobic exercise and load-management plan; adapt tasks and restraints; protect injured area and follow fracture/injury assessment protocol when trauma or severe pain occurs.",["vitals","symptom"],"Observed in human spaceflight (group-level source: NASA Risk of Cardiovascular Adaptations (CV Risk), Concern of Venous Thromboembolism; see source column)","R, G","G01 – Cardiovascular and circulation management","Rugged wearable; minimize measurement burden during EVA; assess before/after excursions; urgent return-to-habitat plan for red flags."],["Radiation and blood effects","Radiation-induced cardiovascular disease/vascular injury","Ionizing radiation may damage endothelium and accelerate vascular disease.","For a radiation event: follow shelter/retreat protocol, maximize shielding, minimize time in exposed areas, log dose and notify medical/mission operations. Long-term risk: dose surveillance and scheduled clinical follow-up.",["screening","vitals"],"Observed in human spaceflight (group-level source: NASA Risk of Radiation Carcinogenesis; see source column)","R","G03 – Radiation exposure and biological-effects management","Personal dosimeter on each crewmember; EVA go/no-go and immediate shelter/rover return guidance."],["Bones, muscles and physical conditioning","Reduced aerobic capacity and exerci  rapid deterioration.",["symptom"],"Observed in human spaceflight (group-level source: NASA Immune Risk, Risk of Adverse Health Effects Due to Host-Microorganism Interactions; see source column)","I, H","G08 – Infection, immunity and hygiene control","Sealed food/water, clean/dirty separation, wound hygiene and limited-excursion contingency planning."],["Immune health and infection control","Diarrhea, gastroenteritis and foodborne illness","Shared closed habitat, food/water contamination, altered microbiome and hygiene limitations.","Isolate/manage exposure according to infection-control procedure; hygiene and wound care; assess severity and hydration; urgent escalation for systemic illness or rapid deterioration.",["symptom"],"Observed in human spaceflight (group-level source: NASA Immune Risk, Risk of Adverse Health Effects Due to Host-Microorganism Interactions; see source column)","I, H","G08 – Infection, immunity and hygiene control","Sealed food/water, clean/dirty separation, wound hygiene and limited-excursion contingency planning."],["Immune health and infection control","Dust/soil contamination of food, water and habitat surfaces","Regolith and surface dust can be carried into vehicles or habitats on suits, tools and equipment; dust may contaminate surfaces, air, food or water and may carry chemical or microbial hazards.","Prevent transfer through suit/airlock dust-control procedures; isolate affected materials or zones; follow approved cleaning, filtration, sampling and food/water quarantine procedures. Do not consume suspect food or water pending mission-authorized clearance.",["sensor"],"Anticipated / uncertain for specific mission regolith exposure","I, H","G08 – Infection, immunity and hygiene control","Sealed food/water, clean/dirty separation, wound hygiene and limited-excursion contingency planning."],["Immune health and infection control","Immune dysregulation and altered immune-cell function","Stress hormones, microgravity, radiation, sleep disrup ation, wound hygiene and limited-excursion contingency planning."],["Other / cross-system health","Reduced access to emergency care during rover excursions; delayed rescue","Distance from base, limited cabin medical kit, communication constraints, terrain and vehicle failure.","Use prescribed resistance/aerobic exercise and load-management plan; adapt tasks and restraints; protect injured area and follow fracture/injury assessment protocol when trauma or severe pain occurs.",["support"],"Analog / limited direct spaceflight evidence","D, H","G11 – Trauma, acute medical events and emergency response","High-priority SOS, crew location, rover status and return-to-habitat/backup rescue plan; compact trauma kit."],["Digestion, nutrition, hydration and metabolism","Kidney stones (nephrolithiasis)","Bone calcium release, dehydration, concentrated urine, altered fluid dynamics and diet increase stone risk.","Use prescribed resistance/aerobic exercise and load-management plan; adapt tasks and restraints; protect injured area and follow fracture/injury assessment protocol when trauma or severe pain occurs.",["symptom"],"Observed in human spaceflight (group-level source: NASA Food and Nutrition Risk, Risk of Renal Stone Formation; see source column)","G, H","G09 – Digestive, nutrition, hydration and renal management","Pre-pack water/electrolytes and emergency GI supplies; maintain food/water cleanliness and excursion reserve."],["Digestion, nutrition, hydration and metabolism","Urinary retention, incontinence and altered voiding","Fluid shifts, space adaptation, privacy/toilet constraints, medications and operational interruption.","Use prescribed resistance/aerobic exercise and load-management plan; adapt tasks and restraints; protect injured area and follow fracture/injury assessment protocol when trauma or severe pain occurs.",["symptom"],"Analog / limited direct spaceflight evidence","G, H","G09 – Digestive, nutrition, hydration and renal management","Pre-pack water/electro function analyze(text, sev){

  const inside = ([a, b], [c, d]) => c <= a && b <= d && (d - c) > (b - a);

  const off = (AREA_KEYS[a] || []).filter(k => cmp(id, k).k === 'amber');
  if (off.length) return {k:'amber', t:'Reading outside your usual range'};
  if (id === 'C' && a === 'eyes') return {k:'unavail', t:'Information unavailable'};
  return {k:'normal', t:'Within your usual range'};
}
function areaReading(id, a){
  switch (a) {
    case 'head': return ['Temperature', `${cur(id,'temp').toFixed(1)} °C`];
    case 'eyes': return id === 'C' ? null : ['Last vision check-in', `No change reported · ${fmtD(DATES[N-4])}`];

    case 'whole': { const s = cur(id,'sleep'); return s == null ? ['Sleep last night', 'Unavailable — wearable not synced for 2 days'] : ['Sleep last night', `${s} hours`]; }

}

/* ---------- store-and-forward link to Earth ---------- */
function enqueue(crew, what){
  if (!CREW[crew]) return;
  const now = Date.now();
  S.queue.unshift({id: ++S.qid, crew, what, created: now, sent: S.link.up ? now : null, env: S.env[crew]});
}
const arriveAt = q => q.sent == null ? null : q.sent + delaySec(q.env) * 1000 / S.timeLapse;
const qStatus = q => { const a = arriveAt(q); if (a == null) return 'waiting'; return Date.now() >= a ? 'delivered' : 'transit'; };
const fmtCount = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return t >= 60 ? `${Math.floor(t / 60)}:${pad2(t % 60)}` : `${t} s`; };
function linkBadge(){
  const crew = staff() ? null : S.user, env = crew ? S.env[crew] : 'base';
  const pend = S.queue.filter(q => (!crew || q.crew === crew) && qStatus(q) !== 'delivered').length;
  if (!S.link.up) return `<span class="lk-dot red"></span><span><b>Link down</b><small>${pend} queued</small></span>`;
  const d = crew ? fmtDelay(delaySec(env)) : `${destName()}`;
  return `<span class="lk-dot ${pend ? 'info' : 'ok'}"></span><span><b>${staff() ? 'Link to crew' : 'Link to Earth'}</b><small>${crew ? `${d} delay` : d}${pend ? ` · ${pend} in transit` : ''}</small></span>`;
}
function queueRows(){
  const crew = staff() ? null : S.user, L = S.queue.filter(q => !crew || q.crew === crew);
  if (!L.length) return `<p class="small muted">Nothing sent yet. Check-ins, reports and readings appear here as they travel to Mission Control.</p>`;
  return L.slice(0, 30).map(q => { const st = qStatus(q), a = arriveAt(q);
    return `<div class="q-row"><span class="lk-dot ${st === 'delivered' ? 'ok' : st === 'waiting' ? 'red' : 'info'}"></span><div style="flex:1"><b>${esc(q.what)}</b><div class="small muted">${CREW[q.crew].name} · created ${fmtT(new Date(q.created))}</div></div>
      <span class="small q-st" data-qid="${q.id}">${st === 'delivered' ? 'Delivered' : st === 'waiting' ? 'Waiting for link' : `Arrives in ${fmtCount(a - Date.now())}`}</span></div>`; }).join('');
}
let lastDelivered = -1, lastThArrived = false;
setInterval(() => {
  const lb = document.getElementById('linkBadge'); if (lb) lb.innerHTML = linkBadge();
  document.querySelectorAll('.q-st[data-qid]').forEach(el => { const q = S.queue.find(x => x.id === +el.dataset.qid); if (!q) return; const st = qStatus(q); el.textContent = st === 'delivered' ? 'Delivered' : st === 'waiting' ? 'Waiting for link' : `Arrives in ${fmtCount(arriveAt(q) - Date.now())}`; });
  document.querySelectorAll('[data-countdown]').forEach(el => { el.textContent = fmtCount(+el.dataset.countdown - Date.now()); });
  const del = S.queue.filter(q => qStatus(q) === 'delivered').length;
  if (del !== lastDelivered) { lastDelivered = del; if (S.role === 'fs' && S.page === 'crew' && !S.modal) render(); }
  const ta = thArrived(); if (ta !== lastThArrived) { lastThArrived = ta; if (staff() && S.page === 'thresholds' && !S.modal) render(); }
}, 1000);

function addConcern(id, area, level, text, care){
  enqueue(id, `Reported concern${CARE(care) ? ': ' + CARE(care).title : ''}`);
  const ex = S.concerns[id].find(c => c.area === area && (c.care === care || !care || !c.care));
  if (ex) { if (level === 'red') ex.level = 'red'; ex.text = text; ex.time = new Date(); if (care) ex.care = care; return; }
  S.concerns[id].push({area, level, text, time:new Date(), care});
}
function notifications(){
  const alertsL = [], reminders = [];
  const ids = staff() ? ['A','B','C'] : [S.user];
  ids.forEach(id => {
    const pre = staff() ? `${CREW[id].name}: ` : '', go = staff() ? 'mo:' + id : 'support';
    alerts(id).filter(a => !a.resolved).forEach(a => (a.advisory ? reminders : alertsL).push({level:a.level, kind: a.advisory ? 'Advisory' : null, title: pre + a.title, sub:`${fmtT(a.time)} · simulated`, go}));
    if (!staff()) { const dm = medsDue(id); if (dm.length) reminders.push({level:'info', kind:'Medicine', title:`Take your ${MED_OPTIONS[dm[0].key].name.split(' (')[0].toLowerCase()}`, sub:`${dm[0].schedule} · as prescribed`, go:'dashboard'}); }
    if (!staff()) { const md = MEASURES.filter(([k]) => !(S.measured[id] || {})[k]).length; if (md) reminders.push({level:'info', title:`${md} measurement${md > 1 ? 's' : ''} due today`, sub:'Part of your morning routine', go:'dashboard'}); }
    if (S.role === 'mo' && id === 'A' && S.thPending && thArrived()) reminders.push({level:'info', kind:'Update', title:'Threshold update from the flight surgeon arrived', sub:'Confirm it on the Alert thresholds page', go:'thresholds'});
    if (!S.today[id]) reminders.push({level:'info', title: pre + (staff() ? 'daily check-in pending' : 'Daily check-in not yet completed'), sub:'Today', go: staff() ? go : 'check'});
  });
  return {alerts: alertsL, reminders};
}

const PILL_IC = {ok:'ok', amber:'warn', red:'alert', grey:'minus', info:'info', normal:'info', unavail:'minus'};
const PILL_CL = {ok:'ok', amber:'amber', red:'red', grey:'grey', info:'info', normal:'info', unavail:'grey'};

const greet = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; };

function niceStep(r){ const e = Math.pow(10, Math.floor(Math.log10(r))); const f = r / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function scaleFor(vals, extra = []){
  const v = vals.concat(extra).filter(x => x != null);
  let lo = Math.min(...v), hi = Math.max(...v);
  const p = (hi - lo) * .15 || 1; lo -= p; hi += p;
  const st = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
  const ticks = []; for (let t = lo; t <= hi + 1e-9; t += st) ticks.push(+t.toFixed(2));
  return {ymin:lo, ymax:hi, ticks};
}

/* ---------- line chart (SVG) ---------- */
function chart(o){
  const W = 560, H = o.h || 190, L = 42, R = 14, T = 12, B = 28, n = o.dates.length;
  const x = i => L + (n <= 1 ? 0 : i * (W - L - R) / (n - 1));
  const y = v => T + (1 - (v - o.ymin) / (o.ymax - o.ymin)) * (H - T - B);
  const f = o.fmt || (v => v);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.label)}">`;
  [o.band, o.band2].filter(Boolean).forEach(bd => { s += `<rect x="${L}" y="${y(bd[1])}" width="${W - L - R}" height="${y(bd[0]) - y(bd[1])}" fill="#B9D4F1" opacity=".5" rx="3"/>`; });
  o.ticks.forEach(t => { s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#EDF1F5"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" class="ax">${f(t)}</text>`; });
  const k = Math.min(5, n);
  for (let j = 0; j < k; j++) { const i = Math.round(j * (n - 1) / (k - 1)); s += `<text x="${x(i)}" y="${H - 8}" text-anchor="${j === 0 ? 'start' : j === k - 1 ? 'end' : 'middle'}" class="ax">${fmtD(o.dates[i])}</text>`; }
  o.series.forEach(se => {
    let p = '', pen = false;
    se.d.forEach((v, i) => { if (v == null) { pen = false; return; } p += (pen ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); pen = true; });
    s += `<path d="${p}" fill="none" stroke="${se.color}" stroke-width="${se.width || 2.4}" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
    let li = se.d.length - 1; while (li >= 0 && se.d[li] == null) li--;
    if (li >= 0) s += `<circle cx="${x(li)}" cy="${y(se.d[li])}" r="4" fill="#fff" stroke="${se.color}" stroke-width="2.4"/>`;
  });
  const bw = (W - L - R) / Math.max(1, n - 1);
  o.dates.forEach((d, i) => {
    const vals = o.series.map(se => se.d[i]);
    s += `<rect x="${x(i) - bw / 2}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"><title>${fmtD(d)}: ${vals.map(v => v == null ? 'unavailable' : f(v)).join(' / ')} ${o.unit || ''}</title></rect>`;
  });
  return s + '</svg>';
}

function indSpark(id, key, k, hint){

/* ---------- NASA's five hazards, with live status ---------- */
const HAZARDS = [
  ['radiation','rad','Invisible particles from the Sun and deep space that raise long-term cancer, heart, eye and brain risks.','Dosimeter readings, solar storm warnings with shelter guidance, and radiation dose reviews.'],
  ['isolation','users','Long periods in small spaces, away from family, with a heavy workload.','Daily mood check, guidance for stress, loneliness, conflict and lack of privacy, and cognitive test reminders.'],
  ['distance','orbit','Help from Earth is far away and messages can take many minutes.','Self-care steps so you can act without waiting, time-to-help and communication-delay information, and the crew medical officer view.'],
  ['gravity','body','Microgravity or partial gravity changes bones, muscles, the heart, eyes and balance.','Bone, fitness and eye screening reminders, exercise tracking, and fall and motion-sickness guidance.'],
  ['closed','wind','A sealed habitat where air, water and noise must be controlled.','CO₂, oxygen, toxic gas, dust, pressure, water and noise sensors with automatic alerts.']
];
function hazardStatus(id, k){
  const sg = sensorSignals(id), env = S.env[id], t = S.today[id];
  if (k === 'radiation') return sg.rad ? [sg.rad[0] === 'urgent' ? 'red' : 'amber', sg.rad[1]] : ['ok', `${envVals(id).rad} mSv/day · as planned`];
  if (k === 'isolation') { const c = S.concerns[id].some(x => ['s-low','s-stress','s-conflict','s-privacy','s-grief'].includes(x.care)); if (c || (t && MOODS.indexOf(t.mood) >= 3)) return ['amber', 'Behavioural health concern reported']; return t ? ['ok', `Mood today: ${t.mood}`] : ['grey', 'Mood not reported today']; }
  if (k === 'distance') return ['info', env === 'rover' ? `Help ≈ 40 min away · Earth ${fmtDelay(delaySec(env))}` : env === 'station' ? 'Help on board · almost no delay' : `${fmtDelay(delaySec(env))} delay to Earth`];
  if (k === 'gravity') { const od = screenings(id).filter(x => x.left < 0 && ['bone','fitness','eye'].includes(x.k)).length; const g = gravityOf(env); return od ? ['amber', `${g} · ${od} screening${od > 1 ? 's' : ''} overdue`] : ['ok', `${g} · screenings up to date`]; }
  const bad = ['co2','o2low','o2high','tox','press','pm','water','noise'].filter(x => sg[x]);
  if (bad.length) return [bad.some(x => sg[x][0] === 'urgent') ? 'red' : 'amber', `${bad.length} sensor alert${bad.length > 1 ? 's' : ''}`];
  return ['ok', 'All habitat sensors normal'];
}
function hazardsCard(id){
  return `<section class="card" style="margin-bottom:28px"><div class="section-head" style="margin-bottom:6px"><h2>NASA’s five hazards of spaceflight</h2><span class="tag">${ENVS[S.env[id]].name}</span></div>
    <p class="small muted" style="margin-bottom:12px">NASA’s Human Research Program groups spaceflight health risks into five hazards. Here is how each one looks for you right now.</p>
    <div class="hz-grid">${HAZARDS.map(([k, ic]) => { const st = hazardStatus(id, k); return `<button class="hz-tile" data-act="hazard" data-v="${k}"><span class="ind-ic">${icon(ic, 18)}</span><b>${HZ[k]}</b>${pill(st[0], st[1])}<span class="small muted">How CrewPulse helps →</span></button>`; }).join('')}</div></section>`;
}

const PTS_BASE = {A:340, B:520, C:210}, STREAK_BASE = {A:11, B:23, C:1};

}

const STORM_STEPS = ['Forecast','Shelter','Headcount','Peak','All-clear'];

      `<b>All-clear received from Mission Control.</b> You can leave the shelter. Report any nausea, tiredness or skin redness in the Daily Check.`

function stormStep(n){
  const sc = S.script; sc.step = n;
  if (n === 1) sc.deadline = Date.now() + 45 * 60000 / S.timeLapse;
  if (n === 2) { const others = ['A','B','C'].filter(c => staff() || c !== S.user); others.forEach((c, i) => setTimeout(() => { if (S.script && !S.script.shelter.includes(c)) { S.script.shelter.push(c); render(); } }, 900 * (i + 1))); }
  if (n === 3) ['A','B','C'].forEach(c => { S.sim[c].rad = 12; S.simTime[c] = new Date(); enqueue(c, 'Dose-rate alert: solar particle event'); });
  if (n === 4) ['A','B','C'].forEach(c => { delete S.sim[c].rad; if (S.scenario[c] === 'storm') S.scenario[c] = 'none'; });
}

function healthTimeline(id, range, staffView){

function baselineTable(id, withDiff){

/* ---------- daily check ---------- */
function dcNext(d){ return d.step === 2 ? d.mood : d.step === 3 ? d.sleep : d.step === 4 ? d.symptoms.length > 0 && (!d.symptoms.includes('Other') || (d.other.trim() && d.otherSev)) : d.step === 5 ? d.readings : true; }
function careKeys(t){
  const k = [];
  if (t.mood === 'Very unwell') k.push('urgent');
  const n = (t.symptoms || []).filter(s => s !== 'No symptoms' && s !== 'Other').length + ((t.symptoms || []).includes('Other') && (t.other || '').trim() ? 1 : 0);
  const unwell = t.mood === 'Not good' || t.mood === 'Very unwell';
  if (n >= 4 && unwell) k.push('manyunwell'); else if (n >= 3 || (n >= 2 && t.mood === 'Not good')) k.push('multi');
  if (t.otherSev === 'severe') k.push('severe');
  (t.symptoms || []).filter(s => s !== 'No symptoms' && s !== 'Other').forEach(s => k.push(s));
  if (t.sleep === SLEEPS[0] || t.sleep === SLEEPS[1]) k.push('sleep');
  if (t.mood === 'Not good') k.push('mood');
  if (t.readings === 'wrong') k.push('readings');
  return k;
}
function nextAction(t){
  const k = careKeys(t), oa = t.otherRes;
  if (oa && oa.level === 'urgent') return ['red','Contact the medical officer now about the symptom you described. Your check-in has been shared with them (simulated).'];
  if (k.includes('urgent') || k.includes('manyunwell') || k.includes('severe')) return ['red','Contact the medical officer now. Your check-in has been shared with them (simulated).'];
  if (k.includes('multi')) return ['amber','Contact the medical officer today — you reported several symptoms at once (not an emergency). Try the self-care steps below in the meantime.'];
  if (oa && oa.level === 'review') return ['amber','Contact the medical officer today about the symptom you described (not an emergency). Try the self-care steps below in the meantime.'];
  if (k.length || oa) return ['info','Try the self-care steps below. Your medical officer can see your check-in, so you only need to contact them if a warning sign appears or things don’t improve.'];
  return ['ok','No further action today. Continue your scheduled activities.'];
}

function alertBlock(a){
  const C = {amber:['var(--amber-bg)','var(--amber)','warn','Review'], red:['var(--red-bg)','var(--red)','alert','Action needed'], ok:['var(--ok-bg)','var(--ok)','ok','Resolved'], info:['#E5EEF9','var(--navy)','info','Advisory']}[a.level];
  return `<div class="alert ${a.level}"><span class="alert-ic" style="background:${C[0]};color:${C[1]}">${icon(C[2], 20)}</span>
    <div style="flex:1"><div class="row" style="justify-content:space-between"><b>${esc(a.title)}</b>${pill(a.level, C[3])}</div>
    <dl class="meta"><dt>Time</dt><dd>${fmtT(a.time)} · ${fmtD(a.time)}</dd><dt>Information</dt><dd>${esc(a.info)}</dd><dt>Data quality</dt><dd>${esc(a.quality)}</dd></dl></div></div>`;
}
function scenarioSteps(id){
  const sc = S.scenario[id], b = CREW[id].base, list = [];
  ruleAlerts(id).forEach(a => list.push([a.level, a.title, `<p>${a.info} CrewPulse detected this from the sensor reading.</p><ol class="steps-list">${a.steps.map(x => `<li>${x}</li>`).join('')}</ol>`]));
  if (sc === 'hr') {
    if (S.hrRepeat[id]) list.push(['ok', 'Unusual heart-rate reading', `<p>Your repeat measurement (${b.hr + 3} bpm) is within your personal baseline. No further action is needed in this example. The medical officer can still see both readings.</p>`]);
    else list.push(['amber', 'Unusual heart-rate reading', `<p>Your latest reading differs from your personal baseline. This can happen because of movement or a loose sensor.</p><ol class="steps-list"><li>Sit and rest quietly for five minutes.</li><li>Check that the sensor is fitted correctly (measurement-quality check).</li><li>Repeat the measurement.</li><li>If it still differs from your baseline, follow the approved escalation pathway and contact the medical officer.</li></ol><div class="row" style="margin-top:14px"><button class="btn btn-secondary btn-sm" data-act="repeat">${icon('refresh', 16)} Repeat measurement (simulated)</button></div>`]);
  }
  if (sc === 'dehy') list.push(['amber', 'Possible dehydration concern', `<p>You reported symptoms that can be linked with low fluid intake. You can usually deal with this yourself:</p><ol class="steps-list"><li>Drink about 500 ml of water now, in small sips over 15–20 minutes.</li><li>Rest and avoid exercise for the next 30 minutes.</li><li>Keep drinking regularly and log your fluids so you reach today’s target.</li><li>Do a quick check-in on the body map in an hour to see whether you feel better.</li></ol><p class="sc-when">${icon('message', 15)}<span>Contact the medical officer if you still feel dizzy after an hour, you faint, or you cannot keep fluids down.</span></p>`]);
  if (false) list.push(['red', 'Cabin CO₂ concern', `<p>The cabin measurement is above the warning level set for this demonstration.</p><ol class="steps-list"><li>Follow the approved environmental procedure for elevated CO₂.</li><li>Move to a well-ventilated module if instructed.</li><li>Report any headache or breathlessness through the body map or the Daily Check.</li></ol>`]);
  if (sc === 'storm') list.push(['red', 'Solar particle event warning', `<p>A burst of radiation from the Sun is expected soon (lead time in this demo: about 45 minutes). Moving to shelter in time keeps your dose low.</p><ol class="steps-list"><li>Go to ${ENVS[S.env[id]].shelter} now.</li><li>Take your personal dosimeter with you.</li><li>Stay in the shelter until mission control gives the all-clear.</li><li>Report nausea, vomiting, unusual tiredness or skin redness through the Daily Check or the symptom checker.</li></ol>`]);
  if (S.concerns[id].length) {
    const urgent = S.concerns[id].some(c => c.level === 'red');
    const keys = S.concerns[id].map(c => c.care).filter(Boolean);
    list.push([urgent ? 'red' : 'amber', 'Your reported concerns', `<p style="margin-bottom:10px">Your medical officer can see the concerns you reported. ${urgent ? 'Because you marked a concern as urgent, contact the medical officer now or use Call for Help.' : 'Here is what you can do yourself first.'}</p>${selfCare(keys)}`]);
  }
  if (!list.length) return `<div class="note ok">${icon('ok', 18)}<span>There is nothing you need to do right now. If something changes, report it in the Daily Check or on the body map.</span></div>`;
  return list.map(([lv, h, html]) => `<div style="padding:4px 0 14px"><div class="row" style="margin-bottom:6px">${pill(lv, h)}</div>${html}</div>`).join('');
}

/* ---------- profile ---------- */
function checkinHistory(id){
  const r = mulberry(CREW[id].seed + 5), rows = [];
  const t = S.today[id];
  if (t) rows.push({date:t.time, mood:t.mood, sleep:t.sleep, sym:t.symptoms.join(', '), st:'Complete'});
  else rows.push({date:new Date(), mood:'—', sleep:'—', sym:'—', st:'Pending'});
  for (let k = 1; k <= 6; k++) {
    const i = N - 1 - k, v = r();
    const missed = id === 'C' && k === 2;
    const sl = DATA[id].sleep[i];
    rows.push({date:DATES[i], mood: missed ? '—' : MOODS[5 - DATA[id].mood[i]], sleep: missed ? '—' : sl == null ? 'Unavailable' : sl < 4 ? SLEEPS[0] : sl < 6 ? SLEEPS[1] : sl <= 8 ? SLEEPS[2] : SLEEPS[3], sym: missed ? '—' : v < .65 ? 'No symptoms' : v < .82 ? 'Fatigue' : v < .92 ? 'Headache' : 'Muscle discomfort', st: missed ? 'Missed' : 'Complete'});
  }
  const sk = {Complete:'ok', Pending:'grey', Missed:'amber'};
  return `<table class="tbl"><thead><tr><th>Date</th><th>Feeling</th><th>Sleep</th><th>Symptoms</th><th>Status</th></tr></thead><tbody>${rows.map(x => `<tr><td>${fmtD(x.date)}</td><td>${esc(x.mood)}</td><td>${esc(x.sleep)}</td><td>${esc(x.sym)}</td><td>${pill(sk[x.st], x.st)}</td></tr>`).join('')}</tbody></table>`;
}

const app = document.getElementById('app');

function resetDemo(){

  Object.keys(S).forEach(k => delete S[k]); Object.assign(S, makeState(), keep);
  Object.keys(T_DEFAULT).forEach(g => { if (typeof T_DEFAULT[g] === 'object') Object.assign(T[g], T_DEFAULT[g]); });
  Object.keys(MEDREC_DEFAULT).forEach(k => { MEDREC[k] = JSON.parse(JSON.stringify(MEDREC_DEFAULT[k])); });
  if (S.page === 'moProfile' && !S.moSel) S.page = 'crew';
